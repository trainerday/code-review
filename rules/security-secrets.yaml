rules:
  # Hardcoded JWT tokens anywhere in source
  - id: hardcoded-jwt
    pattern-regex: "eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
    message: Hardcoded JWT token detected. Remove from source code.
    severity: ERROR
    languages: [generic]

  # Hardcoded MongoDB connection strings with credentials
  - id: hardcoded-mongodb-uri
    pattern-regex: "mongodb(\\+srv)?://[^\\s\"']+:[^\\s\"']+@[^\\s\"']+"
    message: Hardcoded MongoDB connection string with credentials. Use environment variables.
    severity: ERROR
    languages: [generic]

  # Hardcoded private keys
  - id: hardcoded-private-key
    pattern-regex: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    message: Private key detected in source code. Use a secrets manager.
    severity: ERROR
    languages: [generic]

  # jwt-decode without verification — decodes but does NOT verify signatures
  - id: jwt-decode-no-verify
    pattern-either:
      - pattern: import $X from "jwt-decode"
      - pattern: require("jwt-decode")
      - pattern: import { ... } from "jwt-decode"
    message: >-
      jwt-decode only decodes tokens without verifying signatures.
      Anyone can forge a token. Use jsonwebtoken.verify() or a similar
      library that checks signatures.
    severity: ERROR
    languages: [typescript, javascript]

  # cors() with no configuration — allows any origin
  - id: cors-open-wide
    pattern: cors()
    message: >-
      cors() with no configuration allows any origin to call your API.
      Pass an explicit origin allowlist: cors({ origin: [...] })
    severity: WARNING
    languages: [typescript, javascript]
