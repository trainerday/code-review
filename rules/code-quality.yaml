rules:
  # Loose equality in TypeScript (almost always a mistake)
  - id: no-loose-equality-lhs
    pattern: $X == "..."
    message: Loose equality (==) used with string. Use === instead.
    severity: WARNING
    languages: [typescript]

  - id: no-loose-inequality-lhs
    pattern: $X != "..."
    message: Loose inequality (!=) used with string. Use !== instead.
    severity: WARNING
    languages: [typescript]

  # TODO/FIXME/HACK comments
  - id: todo-comment
    pattern-regex: "//\\s*(TODO|FIXME|HACK|XXX|TEMP|TEMPORARY)\\b"
    message: TODO/FIXME comment found. Track and resolve.
    severity: INFO
    languages: [generic]

  # Empty catch blocks
  - id: empty-catch-block
    pattern: |
      catch ($E) {
      }
    message: Empty catch block silently swallows errors. At minimum, log the error.
    severity: WARNING
    languages: [typescript, javascript]

  # console.log left in production code
  - id: console-log-in-production
    pattern: console.log(...)
    message: console.log() found. Use a proper logger or remove before production.
    severity: INFO
    languages: [typescript, javascript]


  # throw e.message — loses stack trace, Sentry gets no context
  - id: throw-error-message
    patterns:
      - pattern-either:
          - pattern: throw $E.message
          - pattern: throw $E.message + "..."
    message: >-
      Throwing e.message loses the stack trace. Throw the Error object
      directly (throw e) or wrap it (throw new Error('...', { cause: e })).
    severity: WARNING
    languages: [typescript, javascript]

  # Sentry tracesSampleRate set to 1.0 — expensive in production
  - id: sentry-full-tracing
    pattern: "tracesSampleRate: 1.0"
    message: >-
      tracesSampleRate: 1.0 traces 100% of requests. This is expensive
      in production. Use a lower value like 0.1 or 0.2.
    severity: WARNING
    languages: [typescript, javascript]
